name: production-health

on:
  deployment_status:
  schedule:
    # Offset from the top of the hour; GitHub scheduling can still be delayed.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: '실제 장애 없이 알림 테스트 이슈를 생성하고 종료합니다'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

# Serialize incident creation/recovery across deployment, scheduled, and manual runs.
concurrency:
  group: production-health
  cancel-in-progress: false

jobs:
  health:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production' &&
       github.event.sender.login == 'vercel[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Always run the trusted monitor, including redeploys of older application commits.
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check public production dependencies
        id: health
        continue-on-error: true
        run: node scripts/health-check.mjs
        env:
          HEALTH_RESULT_PATH: ${{ runner.temp }}/production-health.json
      - name: Open or resolve the incident notification
        run: node scripts/health-alert.mjs
        env:
          HEALTH_RESULT_PATH: ${{ runner.temp }}/production-health.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEALTH_ALERT_ASSIGNEE: ${{ vars.HEALTH_ALERT_ASSIGNEE || github.repository_owner }}
      - name: Fail the run when production is unhealthy
        if: always() && steps.health.outcome == 'failure'
        run: exit 1
      - name: Test notification delivery without affecting production
        if: inputs.test_alert && steps.health.outcome == 'success'
        run: node scripts/health-alert.mjs
        env:
          HEALTH_RESULT_PATH: ${{ runner.temp }}/production-health.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEALTH_ALERT_ASSIGNEE: ${{ vars.HEALTH_ALERT_ASSIGNEE || github.repository_owner }}
          HEALTH_ALERT_TEST: 'true'
