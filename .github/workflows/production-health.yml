name: production-health

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

# Avoid overlapping checks of the public production endpoint.
concurrency:
  group: production-health
  cancel-in-progress: false

jobs:
  health:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production' &&
       github.event.sender.login == 'vercel[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Always run the trusted monitor, including redeploys of older application commits.
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check public production dependencies
        run: node scripts/health-check.mjs
